<!DOCTYPE html>
<html lang="fa-IR" dir=""ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live CSS Left/Right Processor</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; padding: 10px; }
    #output { margin-top: 20px; height: 200px; background: #f7f7f7; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
  </style>
</head>
<body>
  <label for="editor">Input CSS:</label>
  <textarea id="editor" placeholder="Paste your CSS here..."></textarea>
  
  <label for="output">Processed Output:</label>
  <textarea id="output" readonly placeholder="Processed CSS will appear here..."></textarea>

  <script>
    const editor = document.getElementById('editor');
    const output = document.getElementById('output');

    function processCSS() {
      const lines = editor.value.split('\n');
      const result = [];
      lines.forEach(line => {
        if (/left\s*:/i.test(line) || /right\s*:/i.test(line)) {
          const indent = line.match(/^\s*/)[0];
          const trimmed = line.trim();

          if (/\/\*max\*\/$/.test(trimmed)) {
            return;
          }

          let swapped = trimmed
            .replace(/left\s*:/gi, '__TMP__:')
            .replace(/right\s*:/gi, 'left:')
            .replace(/__TMP__:/g, 'right:');

          swapped += ' /*max*/';

          result.push(indent + swapped);
        } else {
          result.push(line);
        }
      });

      output.value = result.join('\n');
    }

    editor.addEventListener('input', processCSS);
  </script>
</body>
</html>
